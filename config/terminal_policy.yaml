version: 1
allowed_executables:
  - echo
  - printf
  - ls
  - dir
  - pwd
  - whoami
  - ipconfig
  - ping
blocked_patterns:
  - pattern: '(?i)(?:^|[\s;&|])rm\s+(?:-[^\s]*r[^\s]*f|-[^\s]*f[^\s]*r)\s+(?:/|/\*|~/?|[A-Za-z]:\\(?:\\)?)(?:\s|$)'
    reason: recursive forced deletion of a root or drive
  - pattern: '(?i)(?:^|[\s;&|])format(?:\.com)?\s+(?:[A-Za-z]:|/[A-Za-z])'
    reason: disk format command
  - pattern: '(?i)(?:^|[\s;&|])del(?:\.exe)?\s+/[fqs](?:\s+/[fqs]){1,3}\s+'
    reason: recursive or quiet Windows deletion
  - pattern: '(?i)(?:^|[\s;&|])rmdir(?:\.exe)?\s+/s(?:\s|$)'
    reason: recursive Windows directory deletion
  - pattern: '(?i)\bremove-item\b.*(?:-recurse|-force)'
    reason: recursive PowerShell deletion
  - pattern: '(?i)\b(?:diskpart|mkfs(?:\.\w+)?|shutdown|reg\s+delete)\b'
    reason: system or disk modification command
  - pattern: '(?i)(?:^|[\s;&|])dd\s+.*\bof=/dev/'
    reason: direct write to a device
  - pattern: '(?i)\bgit\s+clean\s+.*-[^\s]*f'
    reason: forced removal of untracked repository files
timeout_seconds: 30
max_output_bytes: 8000
require_override_commands:
  - "rm "
  - "del "
  - "mv "
  - "shutdown"
  - "reboot"
  - "format "
deny_commands:
  - "rm -rf /"
  - "rm -rf C:\\"
  - "del /f /s /q C:\\*"
  - "rd /s /q C:\\"
