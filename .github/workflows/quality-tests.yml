name: JARVIS quality tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-tests:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest-asyncio pytest-timeout
      - name: Run fast non-live suite
        run: python -m pytest -q -rs -m "not live" --ignore=tests/test_viewer3d.py

  offscreen-startup:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest-asyncio pytest-timeout
      - name: Cold-start UI and HUD without provider credentials
        run: python -m pytest -q -rs -m live tests/test_startup.py

  live-ttft:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if ollama list >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          ollama pull qwen2.5:7b
      - name: Measure live streaming TTFT
        env:
          JARVIS_OLLAMA_MODEL: qwen2.5:7b
        run: python benchmarks/bench_ttft_live.py --repeats 3 --timeout-seconds 1800 --output test-evidence/ttft-live.json
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-ttft-report
          path: test-evidence/ttft-live.json
          if-no-files-found: ignore
